# Language-neutral loadable-backend manifest — read by the shared BackendStore (knaif-models).
# Records the opt-in GPU backend payloads `knaif backend install` can fetch into the directory the
# runtime scans (`~/.knaif/backends`, or $KNAIF_BACKENDS_DIR).
#
# THIS IS A BILL OF MATERIALS, NOT A CATALOG, and it is STRICTER THAN THE MODEL MANIFEST. It ships
# inside the *product* artifact — beside core_tools.yaml and model-manifest.yaml — and answers "what
# payload does THIS build load?", never "what is the newest payload?". It must never resolve
# "latest": a backend whose ABI does not match the binary that loads it is undefined behaviour that
# presents to the user as a driver bug, which is the least debuggable outcome available.
#
# The manifest is read by an already-installed knaif deciding what to download, so it cannot live in
# the payload it describes. That is why it ships in the product artifact and why installers/package.sh
# stages contracts/backends/ explicitly (a manifest nobody has is a payload nobody can install).
#
# --- Five ways this differs from contracts/models/model-manifest.yaml ---
#   1. MANY FILES PER ENTRY. A model is one GGUF with one sha256; a backend is the ggml lib plus
#      NVIDIA's redistributables plus whatever runtime must sit beside them on that OS. Every file
#      carries its own sha256 (C6a).
#   2. TWO SOURCE TAGS, ONE DESTINATION DIRECTORY. The ABI-coupled `ggml-cuda` rides the product
#      release tag; NVIDIA's redist rides the dedicated `redist-cuda-13.3` pre-release tag, which is
#      never deleted and is shared across knaif releases. `tag:` records which is which; the URL is
#      what the store acts on. All files land in one flat directory, because that is what the loader
#      scans.
#   3. THE BINDING IS INVERTED. The model manifest is deliberately forgiving — a knaif upgrade with
#      an unchanged recommendation re-downloads nothing, because the store keys on the model's own
#      filename. A backend is the opposite: an upgrade MUST replace the ABI-coupled lib, and an older
#      payload under a newer binary has to be REFUSED, not tolerated. `knaif_version` below is that
#      binding, and BackendStore stamps it into an install receipt the loader checks before scanning
#      the directory. See docs/NATIVE.md §5.3.
#   4. PLATFORM-KEYED. GGUFs are platform-independent; backend payloads are per OS and arch. Keys are
#      `<os>-<arch>` and match what installers/package.sh names its artifacts.
#   5. IT CARRIES THE DRIVER FLOOR the first-run nudge gates on, so bumping the CUDA toolkit is one
#      edit here rather than a second edit in the gate.
#
# --- Loose files, not archives (decided 2026-07-29) ---
# Each file is its own release asset with its own sha256. Nothing on the install path extracts an
# archive, so BackendStore is the model store's fetch -> .part -> hash -> rename in a loop, plus a
# stage-then-swap of the directory. This is also what keeps per-file SHA pinning, which is the reason
# statically linking the MSVC CRT into ggml-cuda.dll was rejected: a Microsoft CRT fix republishes
# four ~1 MB assets instead of a ~150 MB lib.
#
# --- Publishing ---
# `status: unpublished` means the assets are built but not yet uploaded; `backend install` refuses
# such an entry rather than fetching a `TODO` URL. Flip to `published` only once every url/sha256 is
# real — `python/core/tests/test_backend_manifest_release_ready.py` fails the build otherwise.
# Write URLs against `blackdeep-tech/knaif`; the repo is public, so the tokenless HttpFetcher works
# against release assets with no auth.

# The knaif release this manifest ships inside. BackendStore records it in the install receipt and
# the loader refuses a payload stamped with a different one — an upgraded binary must not load the
# previous release's ggml lib out of ~/.knaif/backends, which survives the upgrade and is scanned
# first. Kept in step with Cargo.toml by python/core/tests/test_version_consistency.py.
knaif_version: "1.1.0"

backends:
  cuda:
    description: "NVIDIA CUDA offload (llama.cpp ggml-cuda backend + NVIDIA redistributables)"
    status: published

    requires:
      vendor: nvidia
      # R580+ is the CUDA 13 driver floor. `nvcuda.dll` / libcuda.so presence alone is NOT
      # sufficient — an older driver loads the lib and then fails, which reads as "CUDA didn't
      # work". The first-run nudge reads this number; do not duplicate it in code.
      min_driver: 580
      cuda_toolkit: "13.3"

    nudge:
      # Compute capabilities where the VULKAN FALLBACK IS INADEQUATE, not merely slower — i.e. where
      # this payload is what makes the product work rather than what makes it faster. Measured, never
      # assumed: docs/PERFORMANCE.md §2, 2026-07-14, on knaif's real workload (Qwen3-4B q4_k_m,
      # 3938-token ffmpeg prompt). On sm_120 Vulkan generates at ~5.7 tok/s against the CPU's ~5.9 —
      # a user with the newest NVIDIA card runs the "GPU" artifact at CPU speed, which is not a
      # slower option but a product that reads as broken. The sm_120 / coopmat2 path is the culprit.
      #
      # THIS IS DATA ON PURPOSE. The defect is in a llama.cpp/driver code path and may be fixed
      # upstream; a "Blackwell is broken" list baked into the code would then lie in the other
      # direction with nothing to catch it. Re-measure each supported architecture when the
      # llama.cpp pin moves, record it in PERFORMANCE.md, and edit this list.
      #
      # Everything NOT listed here gets the soft offer: CUDA is faster and optional. Note that
      # sm_86 is the only pre-Blackwell architecture ever measured — Turing, Ada and Hopper are
      # unverified, so the copy must not imply otherwise.
      vulkan_inadequate_compute_caps: ["12.0"]

    platforms:
      linux-x64:
        files:
          - name: libggml-cuda.so
            tag: product
            url: https://github.com/blackdeep-tech/knaif/releases/download/v1.1.0/libggml-cuda.so
            sha256: "85d0bdb66c92e84ee206c3817673938bedf08a34833bf387311a6c8d188c07f5"
            size_bytes: 162984592
          - name: libcudart.so.13
            tag: redist-cuda-13.3
            url: https://github.com/blackdeep-tech/knaif/releases/download/redist-cuda-13.3/libcudart.so.13
            sha256: "9f92e4c3f7e14d0fed69ef876a45d4255a2dc88cb552a673a90ce881c26282fe"
            size_bytes: 782080
          - name: libcublas.so.13
            tag: redist-cuda-13.3
            url: https://github.com/blackdeep-tech/knaif/releases/download/redist-cuda-13.3/libcublas.so.13
            sha256: "bdcdcd88306621a8d6748b2750b14ad9c73fd80c8085d6a122bf39a6e9dd1375"
            size_bytes: 54502040
          - name: libcublasLt.so.13
            tag: redist-cuda-13.3
            url: https://github.com/blackdeep-tech/knaif/releases/download/redist-cuda-13.3/libcublasLt.so.13
            sha256: "db5c748bc095423401029c00294fb8eb3c721c75c363f3d8b744b7c274504ae0"
            size_bytes: 513446912
          # The licence texts travel WITH the bytes, into the user's backends directory. Under
          # loose-file publishing the release *page* is not what reaches a user's disk, and NVIDIA's
          # EULA permits redistribution only WITH the licence text — so these are payload files, not
          # release-page attachments. package.sh stages both unconditionally and hard-fails without
          # the EULA; `test_backend_payload_manifest.py` asserts this list keeps up with it.
          - name: llama.cpp-LICENSE.txt
            tag: product
            url: https://github.com/blackdeep-tech/knaif/releases/download/v1.1.0/llama.cpp-LICENSE.txt
            sha256: "bffc7e34493908aeadebf13d831b189173e6d91e612352ada29192c0c44f37e6"
            size_bytes: 1259
          - name: NVIDIA-CUDA-EULA.txt
            tag: redist-cuda-13.3
            url: https://github.com/blackdeep-tech/knaif/releases/download/redist-cuda-13.3/NVIDIA-CUDA-EULA.txt
            sha256: "088381bc2d891e719a2a9398645b00bb45f3b24231473a8283ac7e3e66b8a028"
            size_bytes: 68070

      windows-x64:
        files:
          - name: ggml-cuda.dll
            tag: product
            url: https://github.com/blackdeep-tech/knaif/releases/download/v1.1.0/ggml-cuda.dll
            sha256: "72193fa38c4afe439ace1768b653a4d74379374fafaeb5123855336e34167f7e"
            size_bytes: 150217216
          - name: cudart64_13.dll
            tag: redist-cuda-13.3
            url: https://github.com/blackdeep-tech/knaif/releases/download/redist-cuda-13.3/cudart64_13.dll
            sha256: "b00ca6f53699120da815bf3e06e2e4285fae2f201235b883dcbb50eec51e2a2a"
            size_bytes: 551024
          - name: cublas64_13.dll
            tag: redist-cuda-13.3
            url: https://github.com/blackdeep-tech/knaif/releases/download/redist-cuda-13.3/cublas64_13.dll
            sha256: "8c6bac24474af29627ec96500025a5d410a1b7e8ffa00e1fe13b1781fc6b3ddc"
            size_bytes: 52697712
          - name: cublasLt64_13.dll
            tag: redist-cuda-13.3
            url: https://github.com/blackdeep-tech/knaif/releases/download/redist-cuda-13.3/cublasLt64_13.dll
            sha256: "e323abd89e0f03c1db91a09d7aeb1928de08e1f86192cc713b335fefe3e368a9"
            size_bytes: 463655536
          # The MSVC runtime travels WITH the payload rather than being borrowed from the install
          # dir. It normally resolves from beside knaif.exe, so this is redundancy — but it makes the
          # payload self-contained under any future artifact layout, and it is the arrangement that
          # keeps a Microsoft security fix to ~1 MB of individually pinned files instead of a
          # republished ~150 MB ggml-cuda.dll. Ollama ships the CRT per backend directory for the
          # same reason. Microsoft's Distributable List grants these files; see docs/PROVENANCE.md.
          - name: vcruntime140.dll
            tag: product
            url: https://github.com/blackdeep-tech/knaif/releases/download/v1.1.0/vcruntime140.dll
            sha256: "d1f4225df2cd877dbf130d5668a021dce3f94118455ff5ec952061c30afc9ce7"
