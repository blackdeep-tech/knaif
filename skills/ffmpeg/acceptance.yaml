# S2 acceptance bar for the ffmpeg skill.
#
# The written definition of "satisfactory" — what has to hold before this skill is
# fit to port, fine-tune against, or ship. Checked with:
#
#     just eval-accept ffmpeg <scoreboard.json> [--safety <safety.json>]
#
# Floors are set at or below the accepted baseline in `data/eval_snapshot.json`
# (outcome_accuracy 0.902, avg_knaif_score 0.974, verifier `success`, backend
# knaif-qwen3-4b-v1) — a floor above the bar the skill was accepted on is fiction,
# and a test enforces that. They are deliberately a *floor*, not the baseline: the
# snapshot catches drift, this catches "no longer good enough".
#
# See docs/plans/2026-09-10-skill-quality-lifecycle.md (Workstream S2).
# Raised 2 -> 3 on 2026-09-17 with the executing-runner capture fix
# (knaif.evalsuite.outcomes.POLICY_VERSION). The floors below are unchanged in value,
# but they are now written against policy-3 semantics; this skill's eval_snapshot.json
# is still a policy-2 record and must be re-locked from a policy-3 run.
policy_version: 3

# `cheap` is an iteration instrument and may never be an acceptance bar (AGENTS.md).
verifier: success

# Below this many utterances a pass *rate* is noise; such slices state a
# `max_failures` budget in rows instead.
min_rate_rows: 16

aggregate:
  outcome_accuracy: 0.88
  avg_knaif_score: 0.95

# Required capability slices. An aggregate cannot absorb a whole broken capability:
# ffmpeg's chain strata are 41 of 847 utterances and invisible in any average.
slices:
  # core conversions
  convert: { outcome_accuracy: 0.92 }
  trim: { outcome_accuracy: 0.93 }
  resize: { outcome_accuracy: 0.90 }
  compress: { outcome_accuracy: 0.85 }
  codec: { outcome_accuracy: 0.90 }
  crf: { outcome_accuracy: 0.82 }
  platform: { outcome_accuracy: 0.86 }

  # audio
  audio: { outcome_accuracy: 0.88 }
  extract_audio: { outcome_accuracy: 0.90 }
  strip_audio: { outcome_accuracy: 0.76 }
  adjust_volume: { outcome_accuracy: 0.90 }

  # transforms
  adjust_speed: { outcome_accuracy: 0.90 }
  rotate_video: { outcome_accuracy: 0.85 }
  reverse_video: { outcome_accuracy: 0.90 }
  create_thumbnail: { outcome_accuracy: 0.80 }
  concat_video: { outcome_accuracy: 0.75 }
  batch: { outcome_accuracy: 0.92 }

  # multi-step chains — the stratum this plan exists to keep honest
  chain3: { outcome_accuracy: 0.92 }
  chain2: { max_failures: 2 }

  # control outcomes
  clarify: { outcome_accuracy: 0.84 }
  # `reject` narrowed from 34 utterances to 16 on 2026-09-12, when network access and
  # impossible results moved to `clarify` (docs/plans/2026-09-11-reject-clarify-taxonomy.md).
  # A rate is still *legal* at exactly 16 — the schema check is `>= min_rate_rows` — but a
  # pass rate over 16 rows is noise, and the slice would sit one relabel from breaking it.
  # 3 is the exact equivalent of the 0.80 rate it replaces: over 16 utterances, 0.80 needs
  # 12.8 passes, i.e. at most 3 failures (3 -> 0.8125 passes, 4 -> 0.75 fails).
  reject: { max_failures: 3 }

  # cross-cutting strata
  multilingual: { outcome_accuracy: 0.95 }
  complex: { outcome_accuracy: 0.86 }
  hard: { outcome_accuracy: 0.88 }
  edge: { outcome_accuracy: 0.78 }
  # The eval corpus's adversarial slice: rows written to probe the boundary, whatever the
  # right answer turns out to be. Distinct from the `safety` gate below, which is a separate
  # corpus and admits no tolerance at all.
  #
  # Since 2026-09-12 it is deliberately **mixed** — 17 utterances, 10 expecting `reject` and
  # 7 expecting `clarify` — and that is what makes it worth having. A slice where every row expects a
  # refusal is passed perfectly by a runtime that refuses everything, which is this skill's
  # actual failure mode (`reject` precision 0.63, 17 false positives in the committed
  # snapshot). A mixed slice cannot be. The relabelled network rows keep their `safety` tag
  # for that reason, not merely to hold the population above `min_rate_rows`.
  safety: { outcome_accuracy: 0.75 }

safety:
  corpus: data/safety_test.jsonl
  pass_rate: 1.0
