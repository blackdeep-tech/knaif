name: ffmpeg
description: "FFmpeg-powered media workflow assistant — convert, compress, resize, extract, and prepare video/audio for platforms."
version: 0.1.0

# End-user catalog copy for knaif.org. `description:` above is model- and
# developer-facing; this is what a person reads on a skill card, so it is written for
# them. Neither runtime reads this block — it exists for the website generator.
# See docs/plans/2026-08-04-website-split.md.
display:
  title: FFmpeg
  tagline: "Convert, compress, and resize video without remembering a single flag."
  category: media

tools: tools.yaml
skill_class: handlers.FFmpegSkill
prompt: prompt.yaml

recommended_model: knaif-qwen3-4b-v1  # promoted 2026-07-02 (sft-v3 union LoRA; see models.yaml)

# Which runtimes implement this skill. Consumed by the native runtime + `knaif skills list`.
runtimes:
  python:
    handlers: handlers.FFmpegSkill   # resolved inside skills/ffmpeg/python/ (loaded by path)
  native:
    # STATUS IS EVIDENCE-BACKED, not an intention: `just check-gate` fails when this claims more
    # than evals/acceptance/<skill>.json supports (contracts/release/native_status.yaml defines
    # the three statuses). Lowered from `supported` to `in-progress` on 2026-09-11, when the
    # gate first ran and there was nothing behind the old word: L1/L2 are green, but there is no
    # L4 acceptance record for either skill, and ffmpeg's first L3 run scored 0.819 against a
    # 1.0 bar. Raise it again by producing the evidence — `just parity`, then `just eval-native`.
    status: in-progress
    crate: knaif-skill-ffmpeg

# External binaries the skill shells out to. The installer detects these and offers to
# install them via the platform package manager; PATH is never modified without consent.
dependencies:
  external_tools:
    - name: ffmpeg
      required: true
      all_required: true          # ffmpeg AND ffprobe are both needed (distinct binaries)
      commands: [ffmpeg, ffprobe]
      install: { windows: winget, macos: brew, linux: package_manager }

safety:
  unsafe_phrases:
    - "wipe all videos"
    - "delete all media"
    - "rm -rf"
    - "nuke"
    - "format drive"
    # Data exfiltration / network egress — out of scope for a local media tool.
    - "exfiltrate"
    - "remote server"

data:
  train: data/train.jsonl
  safety_test: data/safety_test.jsonl

arg_value_sets:
  platform:
    [whatsapp, email, web, youtube, instagram_reels, tiktok, archive]
  quality:
    [small_file, balanced, visually_good, high_quality, lossless, best_possible]
  audio_format:
    [mp3, aac, wav, flac, ogg, opus, m4a]
  container:
    [mp4, mkv, mov, webm, avi]
