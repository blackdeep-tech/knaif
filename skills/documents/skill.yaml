name: documents
description: "Local document toolkit for inspecting, extracting, finding, converting, combining, and compressing files."
version: 0.1.0

# End-user catalog copy for knaif.org — see the note in skills/ffmpeg/skill.yaml.
display:
  title: Documents
  tagline: "Read, convert, combine, and protect documents on your own machine."
  category: documents

tools: tools.yaml
skill_class: handlers.DocumentsSkill
prompt: prompt.yaml

recommended_model: knaif-qwen3-4b-v1  # promoted 2026-07-02 (sft-v3 union LoRA; see models.yaml)

# Which runtimes implement this skill. Consumed by the native runtime + `knaif skills list`.
runtimes:
  python:
    handlers: handlers.DocumentsSkill   # resolved inside skills/documents/python/ (loaded by path)
  native:
    # STATUS IS EVIDENCE-BACKED, not an intention: `just check-gate` fails when this claims more
    # than evals/acceptance/<skill>.json supports (contracts/release/native_status.yaml defines
    # the three statuses). Lowered from `supported` to `in-progress` on 2026-09-11, when the
    # gate first ran and there was nothing behind the old word: L1/L2 are green, but there is no
    # L4 acceptance record for either skill, and ffmpeg's first L3 run scored 0.819 against a
    # 1.0 bar. Raise it again by producing the evidence — `just parity`, then `just eval-native`.
    status: in-progress
    crate: knaif-skill-documents

# Optional external tools. documents degrades gracefully without them (the affected
# operations report a missing-dependency error); the installer offers them per-feature.
# PATH is never modified without consent. Detection: see python/_deps.py.
dependencies:
  external_tools:
    - name: ghostscript
      required: false
      commands: [gs, gswin64c, gswin32c]
      install: { windows: winget, macos: brew, linux: package_manager }
    - name: libreoffice
      required: false
      commands: [soffice, libreoffice]
      install: { windows: winget, macos: brew, linux: package_manager }
    - name: tesseract
      required: false
      commands: [tesseract]
      install: { windows: winget, macos: brew, linux: package_manager }

data:
  train: data/train.jsonl
  safety_test: data/safety_test.jsonl

# What kind of thing each file is, for chain threading only (read by both runtimes). A later
# step that names a step's source is rewritten onto that step's output only when the two are
# the same kind: "convert report.docx to pdf then find beta in it" threads, a page rendered to
# png does not. An extension listed here nowhere is unrestricted.
# See docs/plans/2026-09-23-chain-source-threading.md.
file_kinds:
  document: [pdf, docx, doc, odt, rtf, txt, md, html, htm]
  image: [png, jpg, jpeg, tif, tiff, bmp, webp, gif]

arg_value_sets:
  compress_quality: [small, balanced, high]
  to_format: [pdf, txt, md, png, jpg]
  position: [top-left, top-center, top-right, center, bottom-left, bottom-center, bottom-right]

safety:
  # Deterministic substring match (lowercased) → immediate reject, pre-model.
  # Verified to catch adversarial destructive phrasings with zero false
  # positives across the eval corpus; keep additions specific (e.g. "format the
  # system", not bare "format") so benign document requests never trip them.
  unsafe_phrases:
    - "delete all documents"
    - "delete everything"
    - "remove everything"
    - "wipe all files"
    - "all files"
    - "erase all"
    - "wipe"
    - "shred"
    - "hard drive"
    - "rm -rf"
    - "nuke"
    - "format drive"
    - "format disk"
    - "format the system"
