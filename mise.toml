# mise provisions and pins the toolchain for the monorepo (see `just bootstrap`).
# Docs: https://mise.jdx.dev/
#
# Migration state (Phase 1): only the Python toolchain is exercised today. The Rust,
# cmake, just, and node pins are declared now so `just bootstrap` can provision them as
# native work lands (Phase 4+). The authoritative Rust pin will be `rust-toolchain.toml`
# added alongside the Cargo workspace in Phase 4; keep this in sync when that lands.
#
# node/pnpm exist for the websites (docs/plans/2026-08-04-website-split.md). Keep the node
# major in sync with whatever the Amplify build image runs — a mismatch between the pin
# here and CI is exactly the drift these pins exist to prevent.

[tools]
python = "3.14"      # top of requires-python ">=3.10,<3.15". This is what mise PROVISIONS,
                     # not a claim about what anyone runs: the maintainer's venv is 3.10.18,
                     # and mise is not installed on that box at all. CI ran the suite on 3.14
                     # for the first time in 2026-08 and found a real failure there, so the
                     # `python` job now runs a MATRIX over both ends of the supported range —
                     # 3.10 and 3.14 — rather than trusting either end untested.
uv = "0.11.2"        # Python env + dependency manager (pinned for reproducibility)
just = "latest"      # human-facing task runner
rust = "1.96.0"      # provides cargo; keep in sync with rust-toolchain.toml (authoritative)
cmake = "latest"     # needed if/when llama.cpp is vendored + built from source
node = "22"          # websites (site/org, site/dev). Pinned, not "latest" — Amplify builds
                     # against this, and a floating major is not reproducible. 22 is what the
                     # dev box runs and clears Astro 7's floor (>=22.12); bumping to 24 is a
                     # deliberate act once verified on both, not a default.
pnpm = "10"          # package manager for the site workspaces (NOT npm)

[env]
# Nothing pinned here yet. The shared model store resolves from $KNAIF_MODELS_DIR at
# runtime (Phase 5); it is intentionally not hard-coded here.
