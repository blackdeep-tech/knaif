# Rust workspace for the native runtime (see docs/plans/2026-06-17-monorepo-dual-runtime.md).
# CLI, and later desktop/mobile, all consume these reusable engine crates.

[workspace]
resolver = "2"
members = [
    "native/crates/knaif-core",
    "native/crates/knaif-models",
    "native/crates/knaif-llm",
    "native/crates/knaif-skill-api",
    "skills/ffmpeg/native",
    "skills/documents/native",
    "apps/cli",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.96"
# Same holder and address as the wheel's `authors` (python/core/pyproject.toml), so the two
# runtimes are attributable to one party wherever they are published. Cargo takes a single
# "Name <email>" string where PEP 621 splits the two fields.
authors = ["Blackdeep Technologies <knaif@blackdeep.tech>"]

# One directory per build kind. Cargo's artifact path is `target/<profile>/<bin>` and features are
# NOT part of it, so every feature set used to overwrite the same `target/release/knaif`. Worse,
# llama-cpp-sys-2's build.rs hard-links its shared libs into `OUT_DIR.ancestors().nth(3)` — also
# `target/<profile>/` — which is why switching kinds could panic with `hard_link … AlreadyExists`
# and why a cpu package once shipped the leftover vulkan tree (portable-builds C1/C2).
#
# A profile moves both: the binary and the staged libs. `package.sh --profile release-<kind>`,
# `just build-native-kind <kind>`, and `scripts/verify_build_profile.sh <kind>` all use these names.
# Plain `release` is untouched and stays the default for an un-flagged build.
#
# Cost: a profile is a distinct unit key, so the FIRST build of each one compiles llama.cpp from
# scratch (~15-30 min for cuda). After that, switching kinds costs nothing. `rm -rf
# target/release-<kind>` is the targeted cleanup — `cargo clean` does not reliably remove it.
#
# See docs/plans/2026-09-21-per-backend-build-profiles.md.
[profile.release-base]
inherits = "release"

[profile.release-cpu]
inherits = "release"

[profile.release-vulkan]
inherits = "release"

[profile.release-cuda]
inherits = "release"

[workspace.dependencies]
# Internal crates (path deps; the whole graph builds from the workspace).
knaif-core = { path = "native/crates/knaif-core" }
knaif-models = { path = "native/crates/knaif-models" }
knaif-llm = { path = "native/crates/knaif-llm" }
knaif-skill-api = { path = "native/crates/knaif-skill-api" }
knaif-skill-ffmpeg = { path = "skills/ffmpeg/native" }
knaif-skill-documents = { path = "skills/documents/native" }

# Third-party.
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Filename globbing for ffmpeg batch inputs. Apache-2.0 (same as knaif), zero runtime deps,
# ~1.5k lines, maintained by rust-lang. Already in the tree as a BUILD dep; this makes it a
# runtime one, so `just licenses` must be regenerated (it appends to the existing Apache-2.0
# block). Adopted only after diffing it against Python fnmatch — see run.rs.
glob = "0.3"
# Physical (non-SMT) core count, which std only approximates via available_parallelism (logical).
# llama.cpp wants them separately: generation is memory-bound and peaks at PHYSICAL cores, while
# prompt decode is compute-bound and scales to ALL logical threads. See docs/PERFORMANCE.md §3.
num_cpus = "1.17"
# preserve_order: keep object keys in source (YAML/JSON) order — the fine-tuned model was trained
# on prompts whose example JSON is in insertion order (tool-first), so the prompt builder must
# reproduce that, not serde_json's default alphabetical sort.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Blocking HTTP client for model downloads (no tokio; rustls TLS + redirect following by default).
ureq = "2"
# Progress bars for model downloads (bytes/rate/ETA). MIT, permissive.
indicatif = "0.17"
# Terminal input-buffer flush (tcflush) so keystrokes typed during a long silent inference wait
# don't leak into a later confirm prompt or the shell. Unix only; permissive (MIT/Apache).
libc = "0.2"
# Pure-Rust PDF document model (MIT) for the documents skill's structural ops
# (merge/split/rotate/remove/reorder/inspect) + encryption (encrypt/decrypt, added post-0.34).
# Permissive per the dependency-license policy.
lopdf = "0.43"
# Regex engine (MIT/Apache) for documents find_in_document. Permissive.
regex = "1"
# Office text extraction (docx/pptx via zip + quick-xml; xlsx via calamine). All MIT, permissive.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
calamine = "0.26"
# Rendering backend (feature `pdfium`): PDFium (BSD) via pdfium-render for PDF→image (convert/OCR/
# compress rasterize). Dynamic-loads the runtime lib, so it compiles without the binary present.
# `image` (MIT/Apache) backs rasters + image→pdf + downsampling. See project rendering-strategy memory.
pdfium-render = "0.8"
image = "0.25"
# Win32 bindings (MIT/Apache), used for two things: SetConsoleOutputCP, so the CLI's non-ASCII
# output survives the cp1252 code page a default Windows console starts in; and CreateMutexW, so
# the installer's AppMutex can tell that knaif is running instead of deferring a locked exe to the
# next reboot. Threading pulls Security + Foundation because CreateMutexW's signature names
# SECURITY_ATTRIBUTES and HANDLE. Already in the graph transitively; these features add nothing
# measurable to build time.
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }
# Embeds VERSIONINFO (and later the icon) into knaif.exe. Declared unconditionally rather than
# under [target.'cfg(windows)'.build-dependencies]: a build-dependency cfg is evaluated for the
# HOST, so a Linux->Windows cross build would skip the crate while still targeting Windows, and
# the build script would fail to compile. apps/cli/build.rs gates on CARGO_CFG_TARGET_OS instead.
winresource = "0.1"
