# Release packaging — Linux (post-v1-ci C3) and macOS (the 2026-08-02 macOS support plan, D10).
#
# THIS IS A PACKAGING CHECK THAT HAPPENS TO UPLOAD, NOT A RELEASE. `just package-linux`
# already builds the published Linux artifacts from a clean checkout in the pinned container
# on the maintainer's own box, so this job cannot justify itself on capability. It justifies
# itself on TIMING: packaging breakage found on the PR that caused it is cheap, and found on
# release day is not. The tag-time upload is the smaller half of its value.
#
# IT NEVER PUBLISHES. Draft only. The tag, the public Release and the PyPI upload stay manual
# because none of them can be undone.
#
# CI MUST NOT GENERATE SHA256SUMS. A checksum manifest covering only the Linux half, sitting
# in a draft a human then adds Windows files to, is silently incomplete — one artifact set
# with two authorities over it. SHA256SUMS is generated once, locally, over the final
# complete set, immediately before publishing (RELEASE.md).
#
# LINUX BUILDS INSIDE THE PINNED CONTAINER. Building on an `ubuntu-latest` runner directly
# would reintroduce the exact defect the portable-builds plan exists to remove: a runtime
# floor inherited from whatever the builder happens to be, with nothing to warn you. The job
# runs installers/linux/build-in-container.sh, so the floor is the image's.
#
# WINDOWS IS NOT IN THE MATRIX AT ALL, and that is a decision rather than an omission — see
# RELEASE.md. A self-hosted Windows runner was considered and rejected: on a public repo it
# is the documented worst case (a fork's PR executing on the maintainer's machine), it needs
# that machine online at tag time, and it buys nothing `just package-*` does not already give.
#
# MACOS SIGNS HERE, ON THE TAG ONLY (D10 in the 2026-08-02 macOS support plan). A macOS release
# must be signed and notarized, and doing it here lets the owner cut one without a Mac. The job
# reads the Developer ID certificates and the notarization key from the protected `release`
# environment, which pull requests never reach, and stays OFF until the repository variable
# MACOS_SIGNING is `enabled` — set only after the first build signed by hand on a Mac has passed
# the clean room. It attaches the notarized .zip and the stapled .pkg to the same draft; the
# clean-room runs (E3/E4/E6) and SHA256SUMS stay human steps, exactly as for the other platforms.
#
# TWO CHECKS CANNOT MOVE HERE, and saying so prevents a false sense of coverage: the Windows
# clean room needs Windows Sandbox, which exists on no runner, and the installer upgrade path
# needs a GUI run because /VERYSILENT never builds the task tree. Both stay human steps in
# RELEASE.md §4. A green pipeline is not a verified release.

name: Package

on:
  pull_request:
    # Not every PR — a docs or site change cannot break packaging, and this job is measured
    # in tens of minutes. These are the paths that can.
    paths:
      - "installers/**"
      - "apps/**"
      - "native/**"
      - "skills/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      # Full history: release mode inside the container checks a commit OUT of the mounted
      # repo rather than mounting the worktree, so the commit has to be there to check out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      # The container fetches `+refs/heads/*` and `+refs/tags/*` out of the mounted repo
      # (build-in-container.sh), and on a pull_request the checked-out HEAD is a synthetic
      # MERGE commit that is on neither — the first run died with "reference is not a tree".
      #
      # Fixed here rather than in the script: `just package-linux` is release-critical and
      # its fetch refspec is part of what makes a published artifact reproducible. Giving the
      # commit a branch ref is CI adapting to that contract, not the other way round. It also
      # builds the PR's own head commit, which is the one that actually gets squashed, rather
      # than a merge commit that will never exist again.
      - name: Put the commit under test on a branch ref the container can fetch
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git branch --force ci-build "$SHA"
          git --no-pager log -1 --oneline ci-build

      # Builds the tarball and the AppImage at the image's floor, and runs installers/smoke.sh
      # against both from inside the container — version-vs-Cargo.toml, exe-relative skill
      # resolution from an unrelated cwd, dependency detection, and an offline mock
      # `plan --json`. It never downloads. That smoke run is this job's real gate; the
      # artifacts are the evidence.
      - name: just package-linux
        run: just package-linux --rev=ci-build

      - name: Show what was produced
        run: ls -lh dist/knaif-*-linux-* || (echo "::error::no Linux artifacts in dist/" && exit 1)

      # On a PR this is the whole point: the artifacts are downloadable for inspection
      # without anyone having to reproduce the build.
      - uses: actions/upload-artifact@v4
        with:
          name: knaif-linux-${{ github.sha }}
          path: dist/knaif-*-linux-*
          if-no-files-found: error
          retention-days: 14

  # Tag only, and only once MACOS_SIGNING is enabled (see the header). Builds from the tag's clean
  # checkout with no cache, signs every Mach-O, notarizes the .zip and the .pkg, reads both logs
  # and staples the .pkg — installers/macos/release.sh, the same script a hand run uses.
  macos:
    if: startsWith(github.ref, 'refs/tags/v') && vars.MACOS_SIGNING == 'enabled'
    runs-on: macos-14
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: just package-native metal
        run: just package-native metal

      # A throwaway keychain holding only this run's two identities, deleted in the last step.
      # The identity names are read back from it rather than stored as secrets, so they always
      # match the certificates actually imported.
      - name: Import the Developer ID identities into a temporary keychain
        env:
          APP_P12: ${{ secrets.MACOS_CERT_APP_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/knaif-signing.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          for p12 in APP_P12 INSTALLER_P12; do
            printf '%s' "${!p12}" | base64 --decode > "$RUNNER_TEMP/$p12.p12"
            security import "$RUNNER_TEMP/$p12.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/$p12.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          # shellcheck disable=SC2046  # the existing search list, word-split on purpose
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity() {
            security find-identity -v "$keychain" | grep "\"$1: .*($TEAM)\"" | head -1 \
              | sed -E 's/.*"(.*)".*/\1/'
          }
          app="$(identity 'Developer ID Application')"
          installer="$(identity 'Developer ID Installer')"
          [ -n "$app" ] && [ -n "$installer" ] || { echo "::error::identities for $TEAM not found"; exit 1; }
          {
            echo "KNAIF_SIGN_KEYCHAIN=$keychain"
            echo "KNAIF_SIGN_IDENTITY=$app"
            echo "KNAIF_INSTALLER_IDENTITY=$installer"
          } >> "$GITHUB_ENV"

      - name: Write the notarization key
        env:
          P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "KNAIF_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: just release-macos
        env:
          KNAIF_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KNAIF_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          KNAIF_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: just release-macos

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/knaif-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: knaif-macos-${{ github.sha }}
          path: |
            dist/knaif-*-macos-arm64.zip
            dist/knaif-*-macos-arm64.pkg
          if-no-files-found: error
          retention-days: 14

      # The notarization logs are evidence, not release assets: kept with the run, never attached.
      - uses: actions/upload-artifact@v4
        with:
          name: knaif-macos-notary-${{ github.sha }}
          path: dist/notary/
          retention-days: 90

  # Tag only. Attaches what the jobs above already built and smoke-tested to a DRAFT release,
  # for the maintainer to add the Windows half to by hand before generating SHA256SUMS over
  # the complete set and publishing. Runs when Linux succeeded and macOS either succeeded or was
  # switched off; a FAILED macOS job holds the draft back rather than letting it go out half-made.
  draft:
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.linux.result == 'success' && needs.macos.result != 'failure'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: knaif-linux-${{ github.sha }}
          path: dist

      - if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: knaif-macos-${{ github.sha }}
          path: dist

      - name: Attach the Linux artifacts to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so `gh` cannot infer the repository from git — it failed
          # with "not a git repository" on the v1.2.0 tag, its first real run.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist/

          # --draft, never --publish. `gh release create` is idempotent here only because we
          # check first: a second run on the same tag must not fail the job, and must not
          # quietly turn a draft into a release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists - uploading assets to it"
          else
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Draft. Linux (and, once enabled, macOS) artifacts attached by CI; Windows artifacts are added by hand, then SHA256SUMS is generated over the complete set. See RELEASE.md."
          fi

          # --clobber so a re-run replaces its own uploads rather than erroring. nullglob so a
          # tag without the macOS job uploads the Linux files rather than a literal pattern.
          shopt -s nullglob
          files=(dist/knaif-*-linux-* dist/knaif-*-macos-*)
          gh release upload "$TAG" "${files[@]}" --clobber
