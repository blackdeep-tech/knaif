# eval_backends.yaml — backend configurations for the knaif eval suite.
#
# Add backends here. Run a subset with: --backends qwen3-4b,gemma3-4b
# Omit --backends to run all backends sequentially.
# An unknown name in --backends is a hard error, not a silent fallback.
#
# ⚠️ MODEL AVAILABILITY — CHECK IT, DO NOT READ IT HERE. Most stanzas below are FINE-TUNING
# STUDY ARTIFACTS. Which GGUFs exist is per-machine and changes whenever models are copied,
# rebuilt, or pruned, so no comment in this file can stay true. Ask the filesystem:
#
#   uv run python -c "import yaml,pathlib; b=yaml.safe_load(open('eval_backends.yaml'))['backends']; \
#   [print('OK  ' if pathlib.Path(c['options']['path']).exists() else 'MISS', n) \
#    for n,c in sorted(b.items()) if (c or {}).get('options',{}).get('path')]"
#
# A stanza whose GGUF is missing fails LOUDLY (the orchestrator prints "Model file not found",
# then every row raises "llama.cpp backend not initialized" and scores as `error` → outcome
# ~0.0). It will not silently mock. A run of ~0.0 across the board means the model file is
# absent, not that the model is bad.
#
# Historical note (2026-07-14): the study GGUFs lived on the old RTX 5080 box and were absent
# for a period; the saved scoreboards in evals/ are the record of those runs regardless, and
# the stanzas are kept so a run is reproducible whenever the GGUF is present again.
#
# NAMING: GGUF files on disk use the PUBLIC `knaif-*` names — identical to the artifacts in the
# HuggingFace repo (blackdeep/knaif) and to `file:` in contracts/models/model-manifest.yaml. One name
# for a model, everywhere. The eval backend KEYS below keep their FT-cycle names (`qwen3-4b-sft-v3-
# flat-q4`, …) because they are baked into every saved scoreboard filename in evals/ —
# renaming a key would break the join with its own history. Key = experiment identity, file =
# artifact identity; the `path:` is what maps one to the other.
#
# The two promoted (shipped) models, whatever else is present:
#   models/knaif-qwen3-4b-v2-q4_k_m.gguf   (public knaif-qwen3-4b-v2  — FT cycle sft-v4-flat, Q4_K_M)
#   models/knaif-qwen3-4b-v1-q4_k_m.gguf   (public knaif-qwen3-4b-v1  — FT cycle sft-v3-flat, Q4_K_M)
#   models/knaif-qwen3-1.7b-v1-q6_k.gguf   (public knaif-qwen3-1.7b-v1 — FT cycle sft-v3-flat, Q6_K)
#
# Backend types:
#   backend: llama_cpp — requires GGUF file at options.path (relative to repo root)
#   backend: ollama    — requires ollama running locally (ollama serve)
#
# Stanza-level keys (siblings of `backend:` / `options:`):
#   public_name       The shipped model name (contracts/models/model-manifest.yaml /
#                     models.yaml / HuggingFace). `run` stamps it into the saved
#                     scoreboard as `backend_public_name`, and the report labels the
#                     arm with it instead of this stanza's cryptic-but-stable key.
#                     Set it only on a promoted model; omit for experiment stanzas.
#
# Options (llama_cpp):
#   path              GGUF model file (relative to repo root or absolute)
#   n_ctx             context window in tokens (default 4096)
#   n_gpu_layers      layers offloaded to GPU; 99 = all (default 10)
#   n_threads         CPU threads (default 8)
#   max_tokens        generation budget per call
#   json_mode         GBNF-constrain output to JSON. Disable for thinking models
#                     whose template emits <think> before the JSON object.
#   thinking_enabled  When false, appends "/no_think" to the system prompt
#                     (Qwen3 convention). No-op for non-Qwen3 models.
#   verbose           When true, llama.cpp prints device/backend init logs
#                     (e.g. "using device CUDA0"). Default false. Set true
#                     once when diagnosing why CUDA isn't being used.

# ── lanes ─────────────────────────────────────────────────────────────────────
#
# A LANE IS NOT A BACKEND, and this is a separate top-level section for that reason
# (docs/plans/2026-09-10-skill-quality-lifecycle.md, L4c). Everything under `backends:` is
# handed to `InferenceOrchestrator(backend=...)` by `_make_agent`, so a lane key placed there
# would not be inert — it would be constructed as a token-generation backend and fail, or
# half-work, which is a confusing way to learn about a config mistake.
#
# A backend answers "which model generates the tokens". A lane answers "which runtime is under
# test, end to end". The native lane runs the shipped binary for real — `knaif run`, no
# --dry-run — and is graded on the files it writes to disk (L4a):
#
#   uv run -m knaif.evalsuite native --skill ffmpeg --lane native-cli \
#       --verifier success --save evals/runs/<date>_<label>_success
#
# `binary` must be a build with the llama feature (`cargo build --release -p knaif-cli
# --features llama,cuda,pdfium`); a mock-only build plans nothing and every row scores 0.
lanes:
  native-cli:
    kind: native_cli
    binary: target/release/knaif.exe
    # Repointed to sft-v4 on 2026-09-15 with T7's re-lock. `eval-accept-native` grades this
    # lane against `max(S2 floor, accepted python score - 0.02)`, and the accepted Python
    # score is now sft-v4's — so measuring v1 here would compare two different models and the
    # verdict would mean nothing. sft-v4 is being promoted as `knaif-qwen3-4b-v2`, so the file
    # now carries its public name; the lane reads the path, not the manifest.
    model_path: models/knaif-qwen3-4b-v2-q4_k_m.gguf
    timeout_s: 180

backends:
  # Built-in. No model, no GPU, no GGUF — a null config means "no orchestrator".
  # Substitutes ONLY token generation: the mock planner picks the top retrieval hit
  # and fills args from each tool's `mock_args`, so retrieval, validation, expansion,
  # execution, verifiers and reporting all run for real. Use it to smoke-test the
  # harness itself, or as a retrieval probe (its tool accuracy measures the keyword
  # index). Its OUTCOME ACCURACY IS NOT A MODEL-QUALITY SIGNAL — never quote it as one.
  # Always addressable as `--backends mock`, even against a config that omits it.
  mock:

  qwen3-4b:
    backend: llama_cpp
    options:
      path: models/Qwen3-4B-Q4_K_M.gguf
      description: Qwen3 4B Q4_K_M
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false           # GBNF + thinking_enabled:false = empty {} output: model
                                 # has no reasoning budget and immediately closes the
                                 # object. json_mode:true only works when thinking is on
                                 # (verified 2026-06-08). Keep false; thinking is off.
      thinking_enabled: false    # /no_think suppresses the <think> block

  # ⚠️ OLLAMA IS NOT A SUPPORTED knaif RUNTIME, and this stanza does not make it one. The policy
  # is recorded in native/crates/knaif-llm/src/lib.rs: "No Ollama backend — Ollama is confined to
  # the Python dev/eval path." The native runtime has none, this file does not ship in the
  # artifact, and nothing here is a product surface. It exists so the workbench and the eval
  # suite can ASK A QUESTION, not so anyone can run knaif on Ollama.
  #
  # The SAME model through a different serving stack, so "does this prompt behave the same
  # somewhere other than our llama.cpp build?" is a question that can be asked at all. Pairs with
  # `qwen3-4b` above: same weights, same settings, different host.
  #
  # NOT a quality arm and not comparable on latency — Ollama keeps its own model resident, applies
  # its own template, and its stanza cannot pin a quantisation the way a `path:` can. Use it to
  # separate "the model does this" from "our inference setup does this".
  #
  # Needs a local Ollama: `ollama serve`, then `ollama pull qwen3:4b`. Unreachable or un-pulled,
  # the arm fails loudly rather than mocking — the workbench greys it and says which.
  ollama-qwen3-4b:
    backend: ollama
    model: qwen3:4b
    ollama_url: http://localhost:11434
    options:
      description: Qwen3 4B via Ollama
      max_tokens: 2048
      json_mode: false           # Same reasoning as qwen3-4b: a JSON constraint from the first
                                 # token cannot coexist with a thinking preamble.
      thinking_enabled: false    # /no_think, matching the llama.cpp arm
      request_timeout: 120       # Covers a cold model load plus a full tool-registry prompt

  # phi4-mini removed 2026-06-08: weakest of the three (66.8% outcome, 87.6%
  # knaif) and an over-refusal artifact — it rejected 47 legitimate plan rows
  # to win the safety tags. Not a viable utility backend. GGUF kept on disk;
  # re-add this stanza to benchmark it again.

  gemma3-4b:
    backend: llama_cpp
    options:
      path: models/gemma-3-4b-it-Q4_K_M.gguf
      description: Gemma 3 4B IT Q4_K_M
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: true

  # --- Fine-tuning controlled bases (docs/plans/2026-06-27-fine-tuning.md) ---
  # The untuned half of the 8-cell size x precision x tuned matrix. Built 2026-06-29
  # from freshly-downloaded Qwen3 HF weights through one llama.cpp pipeline (Task 1) —
  # do NOT swap in the pre-existing models/*.gguf above; their provenance differs and
  # would contaminate the quant-tax / gain numbers. Same validated Qwen3 config as
  # qwen3-4b (json_mode:false, thinking_enabled:false). The 4 *-ft-* stanzas land in Task 7.
  qwen3-1.7b-base-f16:
    backend: llama_cpp
    options:
      path: models/qwen3-1.7b-base-f16.gguf
      description: Qwen3 1.7B base, f16 (controlled)
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-1.7b-base-q4:
    backend: llama_cpp
    options:
      path: models/qwen3-1.7b-base-q4.gguf
      description: Qwen3 1.7B base, Q4_K_M (controlled)
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-4b-base-f16:
    backend: llama_cpp
    options:
      path: models/qwen3-4b-base-f16.gguf
      description: Qwen3 4B base, f16 (controlled)
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-4b-base-q4:
    backend: llama_cpp
    options:
      path: models/qwen3-4b-base-q4.gguf
      description: Qwen3 4B base, Q4_K_M (controlled)
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  # --- Fine-tuned half of the matrix (Tasks 6-7, built 2026-06-30) ---
  # One multi-skill LoRA (bf16, r=16, 3 epochs) on the union train.jsonl (ffmpeg 364 +
  # documents 334), trained per base then merged->f16->Q4_K_M through the same llama.cpp
  # pipeline as the base GGUFs. Same options as the *-base-* stanzas so the tuned/untuned
  # comparison is clean. The post-fine-tune success sweep (Task 8) benches these.
  qwen3-1.7b-ft-f16:
    backend: llama_cpp
    options:
      path: models/qwen3-1.7b-ft-f16.gguf
      description: Qwen3 1.7B fine-tuned, f16
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-1.7b-ft-q4:
    backend: llama_cpp
    options:
      path: models/qwen3-1.7b-ft-q4.gguf
      description: Qwen3 1.7B fine-tuned, Q4_K_M
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-4b-ft-f16:
    backend: llama_cpp
    options:
      path: models/qwen3-4b-ft-f16.gguf
      description: Qwen3 4B fine-tuned, f16
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-4b-ft-q4:
    backend: llama_cpp
    options:
      path: models/qwen3-4b-ft-q4.gguf
      description: Qwen3 4B fine-tuned, Q4_K_M
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  # --- 4B-v3 retrain (pass-3 Task 4): same recipe as qwen3-4b-ft, only v1->v3 data changes ---
  qwen3-4b-sft-v3-flat-f16:
    backend: llama_cpp
    options: {path: models/qwen3-4b-sft-v3-flat-f16.gguf, description: "Qwen3 4B SFT v3 flat union, f16", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  qwen3-4b-sft-v3-flat-q4:  # eval key kept stable (baked into saved run filenames); file renamed to knaif convention
    backend: llama_cpp
    public_name: knaif-qwen3-4b-v1   # shipped name — reports label the arm with this, not the eval key
    options: {path: models/knaif-qwen3-4b-v1-q4_k_m.gguf, description: "Qwen3 4B SFT v3 flat union, Q4_K_M (public: knaif-qwen3-4b-v1)", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  # --- 4B-v4 retrain (T6b): same flat recipe and same config as sft-v3-flat-q4 above,
  # only the union corpus moved (reject/clarify taxonomy + the 10 new clarify rows).
  # Compared against the frozen control evals/runs/2026-09-13_t6a-control-v4_success.
  qwen3-4b-sft-v4-flat-f16:
    backend: llama_cpp
    options: {path: models/qwen3-4b-sft-v4-flat-f16.gguf, description: "Qwen3 4B SFT v4 flat union, f16", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  qwen3-4b-sft-v4-flat-q4:  # eval key kept stable (baked into saved run filenames); file renamed to knaif convention
    backend: llama_cpp
    public_name: knaif-qwen3-4b-v2   # shipped name — reports label the arm with this, not the eval key
    options: {path: models/knaif-qwen3-4b-v2-q4_k_m.gguf, description: "Qwen3 4B SFT v4 flat union, Q4_K_M (public: knaif-qwen3-4b-v2)", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  # Inference-config parity T2 (docs/plans/2026-09-23-inference-config-parity.md): the SAME
  # weights and options as the arm above, varying only how llama.cpp is configured, to measure
  # how many answers change when nothing but the config does. Not promotion arms.
  #   -cold:      no KV prefix reuse across rows — isolates corpus-order dependence
  #   -nativecfg: native's config — flash attention on, prompt batch = n_ctx, fresh per call
  qwen3-4b-sft-v4-flat-q4-cold:
    backend: llama_cpp
    public_name: knaif-qwen3-4b-v2
    options: {path: models/knaif-qwen3-4b-v2-q4_k_m.gguf, description: "knaif-qwen3-4b-v2, cold cache per call", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false, reset_cache_per_call: true}
  qwen3-4b-sft-v4-flat-q4-nativecfg:
    backend: llama_cpp
    public_name: knaif-qwen3-4b-v2
    options: {path: models/knaif-qwen3-4b-v2-q4_k_m.gguf, description: "knaif-qwen3-4b-v2, native's llama.cpp config", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false, reset_cache_per_call: true, flash_attn: true, n_batch: 8192}

  # matched-config re-eval of the untuned 4B default + old v1 4B-ft, for a clean 4B-v3 comparison on the 845 corpus
  qwen3-4b-base-q4-mt512:
    backend: llama_cpp
    options: {path: models/qwen3-4b-base-q4.gguf, description: "Qwen3 4B untuned base, Q4_K_M, max_tokens=512", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  qwen3-4b-ft-q4-mt512:
    backend: llama_cpp
    options: {path: models/qwen3-4b-ft-q4.gguf, description: "Qwen3 4B ft v1 union, Q4_K_M, max_tokens=512", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}

  # --- data-v2 1.7B config comparison (best-skill-model Task 2, 2026-06-30) ---
  # The real data-v2 Q4 GGUF lived on the 5080 box and is not here (the file that once carried this
  # name locally turned out to be a mislabeled Q6_K duplicate of knaif-qwen3-1.7b-v1, and was
  # deleted). Rebuild the GGUF before using this stanza; as-is it fails loudly (model not found).
  qwen3-1.7b-ftv2-q4:
    backend: llama_cpp
    options:
      path: models/qwen3-1.7b-ftv2-q4.gguf
      description: Qwen3 1.7B ft data-v2 (r16/3ep), Q4_K_M
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-1.7b-ftv2l-q4:
    backend: llama_cpp
    options:
      path: models/qwen3-1.7b-ftv2l-q4.gguf
      description: Qwen3 1.7B ft data-v2 light (r8/2ep/lr1e-4), Q4_K_M
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-1.7b-ftv2-f16:
    backend: llama_cpp
    options:
      path: models/qwen3-1.7b-ftv2-f16.gguf
      description: Qwen3 1.7B ft data-v2 (r16/3ep), f16
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  qwen3-1.7b-ftv2l-f16:
    backend: llama_cpp
    options:
      path: models/qwen3-1.7b-ftv2l-f16.gguf
      description: Qwen3 1.7B ft data-v2 light (r8/2ep/lr1e-4), f16
      n_ctx: 8192
      n_gpu_layers: 99
      n_threads: 8
      max_tokens: 2048
      json_mode: false
      thinking_enabled: false

  # --- 1.7B v1-adapter quant sweep (best-skill-model Task 3, 2026-06-30) ---
  # v1 data beat data-v2 on the f16 hard slice (0.855 vs 0.800), so the quant sweep
  # uses the existing qwen3-1.7b-ft (r16/3ep) adapter. f16 + q4 already stanza'd above.
  qwen3-1.7b-ft-q5:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-ft-q5.gguf, description: "Qwen3 1.7B ft v1, Q5_K_M", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 2048, json_mode: false, thinking_enabled: false}
  qwen3-1.7b-ft-q6:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-ft-q6.gguf, description: "Qwen3 1.7B ft v1, Q6_K", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 2048, json_mode: false, thinking_enabled: false}
  qwen3-1.7b-ft-q8:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-ft-q8.gguf, description: "Qwen3 1.7B ft v1, Q8_0", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 2048, json_mode: false, thinking_enabled: false}

  # --- ffmpeg-only single-skill fine-tune (standalone-app experiment, 2026-06-30) ---
  qwen3-1.7b-ffmpeg-q6:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-ffmpeg-q6.gguf, description: "Qwen3 1.7B ffmpeg-only ft, Q6_K", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 2048, json_mode: false, thinking_enabled: false}

  # --- ffmpeg-only, v1 data (clean apples-to-apples vs union which used v1) 2026-07-01 ---
  qwen3-1.7b-ffmpegv1-q6:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-ffmpegv1-q6.gguf, description: "Qwen3 1.7B ffmpeg-only ft (v1 data), Q6_K", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 2048, json_mode: false, thinking_enabled: false}

  # --- ffmpeg-v3 hard-targeted SFT grid (2026-07-01) ---
  qwen3-1.7b-sft-v3-flat-q6:  # eval key kept stable (baked into saved run filenames); file renamed to knaif convention
    backend: llama_cpp
    public_name: knaif-qwen3-1.7b-v1   # shipped name — reports label the arm with this, not the eval key
    options: {path: models/knaif-qwen3-1.7b-v1-q6_k.gguf, description: "Qwen3 1.7B SFT v3 flat union, Q6_K (public: knaif-qwen3-1.7b-v1)", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  # pass-3 Task 5 planner-diversity: control (ffmpeg+documents) vs +io, new keywords, same recipe
  qwen3-1.7b-v3b-control-q6:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-v3b-control-q6.gguf, description: "Qwen3 1.7B ffmpeg+documents (new-kw control), Q6_K", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  qwen3-1.7b-v3b-io-q6:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-v3b-io-q6.gguf, description: "Qwen3 1.7B ffmpeg+documents+io (planner-diversity), Q6_K", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  qwen3-1.7b-sft-v3-flat-f16:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-sft-v3-flat-f16.gguf, description: "Qwen3 1.7B SFT v3 flat union, f16 (quant-noise-free read)", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  qwen3-1.7b-sft-v3-flat-q5:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-sft-v3-flat-q5.gguf, description: "Qwen3 1.7B SFT v3 flat union, Q5_K_M", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
  qwen3-1.7b-sft-v3-flat-q8:
    backend: llama_cpp
    options: {path: models/qwen3-1.7b-sft-v3-flat-q8.gguf, description: "Qwen3 1.7B SFT v3 flat union, Q8_0 (diagnostic)", n_ctx: 8192, n_gpu_layers: 99, n_threads: 8, max_tokens: 512, json_mode: false, thinking_enabled: false}
