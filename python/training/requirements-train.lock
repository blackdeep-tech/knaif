# Proven training environment — frozen after the Phase-0 gate passed on 2026-06-29
# (one bf16 LoRA step on Qwen3-1.7B, RTX 5080 / sm_120).
# See docs/plans/2026-06-27-fine-tuning.md Task 0 and training/phase0_smoke.py.
#
# REPRODUCE (do NOT `pip install -r` this directly — see caveat below):
#   uv venv --python 3.12 training/.venv
#   uv pip install --python training/.venv/bin/python torch==2.10.0 \
#       --index-url https://download.pytorch.org/whl/cu128
#   uv pip install --python training/.venv/bin/python -r training/requirements-train.lock
#
# CAVEAT: `uv pip freeze` strips the local version tag, so `torch==2.10.0` below
# is really 2.10.0+cu128. Plain PyPI `torch==2.10.0` is the WRONG (non-sm_120)
# build — torch MUST come from the cu128 index first, as in the commands above.
#
# GGUF CONVERSION (fine-tuning plan Tasks 1 & 7) additionally needs:
#   uv pip install --python training/.venv/bin/python gguf sentencepiece protobuf
# Do NOT install llama.cpp's requirements-convert_hf_to_gguf.txt — it pins CPU
# torch 2.11.0 and would clobber the cu128 GPU torch above.
