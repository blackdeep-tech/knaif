# Core control tools — framework tools merged into every skill registry.
#
# Behavior lives in the Step classes in core_tools.py; this file holds their
# model-facing metadata, loaded through the same registry loader as a skill's
# tools.yaml so both render identically in the prompt. These tools ship
# with core in every language implementation, so they live here (not in a
# skill dir). Keep the entries in sync with CORE_TOOL_MAP by `name`.
#
# `reject` and `clarify` divide one question between them: was the request
# refused because it breaks the active skill's safety policy (`reject`), or
# merely because that skill has no tool for it (`clarify`)? Policy violation
# → reject; inventory gap → clarify, which says so instead of asking an
# open-ended question. WHICH categories are a policy violation is per-skill
# and belongs in skills/<name>/prompt.yaml and SPEC.md — never here, because
# this file binds every skill and SDK consumer (AGENTS.md: keep core
# domain-agnostic). "Delete these files" violates a media tool's policy and is
# the declared job of an authorized file-management skill.

clarify:
  description: "Ask the user for clarification, or say the request is not supported by this skill."
  keywords: [clarify, question, ask, unclear, ambiguous]
  required_args: [question]
  safety_category: safe

reject:
  description: "Refuse a request that violates the active skill's safety policy."
  keywords: [reject, refuse, deny, unsafe, forbidden, dangerous]
  required_args: [reason]
  safety_category: safe

done:
  description: "Signal that the task is complete."
  keywords: [done, complete, finished, end, stop]
  required_args: []
  safety_category: safe

# A run option, not a step: the pipeline removes it from the plan before anything executes and
# alerts when the run ends (success, failure, or a confirmation declined mid-run): a desktop
# notification and a beep. It takes no args; any the model writes are ignored. Retrieved only
# when one of its `triggers` is in the request (a whole word or phrase), never by rank, so a
# request without one gets the same tools and examples as before.
alert_when_done:
  description: "Alert the user (a desktop notification and a beep) when the task has finished."
  required_args: []
  triggers: [beep, beeps, beeping, notify, notification, notified, alert, chime, "ping me",
             "let me know", "tell me when", "when it's done", "when it is done", "when done",
             "when finished", "when it's finished", "when it finishes", "once done",
             "once it's done", "when it's ready", "when ready"]
  safety_category: safe

wait_for_confirmation:
  description: "Pause workflow execution and ask the user to confirm proceeding past a preview."
  required_args: []
  optional_args: [prompt, preview]
  safety_category: safe
  internal: true
